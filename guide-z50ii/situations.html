<script src="commun.js?v=202610281107"></script>
<script>
(function () {
  "use strict";
  var G = window.GZ, $ = G.$, $$ = G.$$;
  var R = [
    ["Un portrait", "portrait", "Fond flou, œil net", "A", "La plus petite valeur f/ possible", "Auto (au moins 1/125 s)", "Auto, max 6400", "AF-S, zone automatique + Personnes", "Picture Control Portrait", "Avec l'objectif du kit : zoome au maximum, rapproche-toi du sujet et éloigne-le du fond. Le flou vient autant de la distance que de l'ouverture."],
    ["Du sport", "sport", "Figer l'action", "S", "Auto", "1/1000 s", "Auto", "AF-C, zone dynamique (M)", "Rafale Continu H (étendu)", "Déclenche par courtes rafales, en anticipant l'action plutôt qu'en la suivant."],
    ["Un paysage", "paysage", "Net de près à loin", "A", "f/8", "Auto", "100", "AF-S, point sélectif au tiers de la scène", "Picture Control Paysage", "L'horizon sur un tiers de l'image, pas au milieu. L'horizon virtuel (touche DISP) le garde droit."],
    ["La ville la nuit", "ville", "À main levée", "A", "La plus grande ouverture", "Auto (au moins 1/30 s avec un objectif VR)", "Auto, max 12 800", "AF-S sur une zone éclairée", "Réduction de vibration : Normal", "Prends trois photos en rafale lente et garde la plus nette."],
    ["Une pose longue", "pose-longue", "Filés de lumière, trépied", "M", "f/8", "5 à 30 s (pose B au-delà)", "100", "Mise au point, puis passage en MF", "Retardateur 2 s", "Le retardateur évite le bougé du doigt. Sur trépied, beaucoup coupent la stabilisation : teste avec ton objectif."],
    ["Des animaux", "animal", "Le regard", "S", "Auto", "1/500 s", "Auto", "AF-C, zone automatique + Animaux", "Illuminateur AF coupé (a11)", "Mets-toi à hauteur de ses yeux : la photo change complètement."],
    ["Des oiseaux en vol", "oiseau", "Rapide et imprévisible", "S", "Auto", "1/2000 s", "Auto", "AF-C, zone dynamique (L) + Oiseaux", "Continu H (étendu) ou C30", "Le prédéclenchement de C15/C30 rattrape l'envol que tu as vu trop tard."],
    ["Un contre-jour", "contre-jour", "Ombres et lumière", "A", "f/4 à f/5.6", "Auto", "Auto", "AF-S, zone automatique", "D-Lighting actif Auto ; correction +0,7 à +1 IL", "Pour un visage, le flash intégré à puissance réduite le débouche."],
    ["Un objet à vendre", "img/carte-eclatee.webp", "Net et fidèle", "A", "f/8", "Auto", "100", "AF-S, zone réduite", "Balance des blancs : pré-réglage manuel", "Trépied, fenêtre sur le côté, feuille blanche en réflecteur, retardateur 2 s."],
    ["Un concert", "concert", "Lumière difficile", "S", "La plus grande ouverture", "1/250 s", "Auto, max 12 800", "AF-C, zone automatique + Personnes", "Mode silencieux (flash impossible)", "En RAW, la couleur des projecteurs se corrige bien mieux après."]
  ];
  var src = function (n, t) { return n.indexOf("/") > -1 ? n : "photos/" + (t || "v") + "/" + n + ".webp"; };
  $("#tuiles").innerHTML = R.map(function (r, i) { return '<button class="tuile apparait" type="button" data-i="' + i + '"><img src="' + src(r[1]) + '" alt="" loading="lazy"' + (r[1].indexOf("/") > -1 ? ' style="object-fit:contain;background:radial-gradient(#fff,#dcdde2)"' : "") + "><span>" + G.echapper(r[0]) + "<small>" + G.echapper(r[2]) + "</small></span></button>"; }).join("");
  $$("#tuiles .apparait").forEach(G.observer);
  var f = $("#feuille"), fond = $("#fond"), dernier = null;
  function ouvrir(i, bouton) {
    var r = R[i]; dernier = bouton;
    f.innerHTML = '<div class="poignee"></div><button class="fermer" type="button" aria-label="Fermer">✕</button><div class="image"><img src="' + src(r[1], "m") + '" alt=""' + (r[1].indexOf("/") > -1 ? ' style="object-fit:contain;background:radial-gradient(#fff,#dcdde2)"' : "") + '></div><div class="corps"><h2 id="f-titre">' + G.echapper(r[0]) + '</h2><div class="reglages-recette">' +

    f.hidden = false; requestAnimationFrame(function () { f.classList.add("ouvert"); fond.classList.add("ouvert"); });
    $(".fermer", f).addEventListener("click", fermer);
    $$("[data-d]", f).forEach(function (b) { b.addEventListener("click", function () { ouvrir((i + +b.dataset.d + R.length) % R.length, dernier); }); });
    $(".fermer", f).focus();
  }
  function fermer() { f.classList.remove("ouvert"); fond.classList.remove("ouvert"); setTimeout(function () { f.hidden = true; }, 400); if (dernier) dernier.focus(); }
  fond.addEventListener("click", fermer);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !f.hidden) fermer(); });
  // tirer la feuille vers le bas pour la fermer
  var y0 = null;
  f.addEventListener("touchstart", function (e) { if (f.scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive: true });
  f.addEventListener("touchmove", function (e) { if (y0 === null) return; var d = e.touches[0].clientY - y0; if (d > 0) f.style.transform = "translate(-50%," + d + "px)"; }, { passive: true });
  f.addEventListener("touchend", function (e) { if (y0 === null) return; var d = e.changedTouches[0].clientY - y0; f.style.transform = ""; y0 = null; if (d > 110) fermer(); });
  $$("#tuiles .tuile").forEach(function (b) { b.addEventListener("click", function () { ouvrir(+b.dataset.i, b); }); });
})();
